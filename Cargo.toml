[package]
name = "rustydroid"
version = "0.1.0"
edition = "2021"
authors = ["RustyDroid Contributors"]
description = "Waydroid APK/bundle compatibility runner and Hyprland adaptation wrapper in Rust"
license = "MIT"
repository = "https://github.com/Kirieshka14/rustydroid"
readme = "README.md"
keywords = ["waydroid", "android", "apk", "wayland", "hyprland"]
categories = ["command-line-utilities", "os"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.29", features = ["sched", "mount", "fs", "user", "signal", "process"] }
libc = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.40", features = ["full"] }
tempfile = "3.12"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
